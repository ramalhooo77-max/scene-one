<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene One — Design & Audiovisual</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #111;
    }
    .hero {
      position: relative;
      display: flex;
      align-items: flex-end;
      min-height: 100vh;
      padding: clamp(24px, 5vw, 72px);
      overflow: hidden;
      isolation: isolate;
      background: #171717;
    }
    .hero-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.72));
    }
    .menu-button {
      position: absolute;
      top: clamp(20px, 4vw, 48px);
      right: clamp(20px, 4vw, 48px);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      color: #fff;
      font-size: 13px;
      letter-spacing: .12em;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 999px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
    }
    .menu-button:hover { background: rgba(255,255,255,.24); }
    .menu-button:focus-visible, .menu a:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }
    .arrow { font-size: 18px; line-height: 1; }
    .headline {
      max-width: 850px;
      margin: 0;
      font-size: clamp(32px, 6vw, 76px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -.04em;
      text-wrap: balance;
    }
    .menu {
      position: absolute;
      top: 88px;
      right: clamp(20px, 4vw, 48px);
      display: none;
      min-width: 190px;
      padding: 18px;
      background: rgba(20,20,20,.68);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 18px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .menu.open { display: grid; gap: 14px; }
    .menu a { color: white; text-decoration: none; }
    .menu a:hover { opacity: .7; }
    @media (max-width: 600px) {
      .hero { min-height: 100svh; }
      .headline { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <!-- Coloque a imagem PNG na mesma pasta deste arquivo e nomeie-a imagem.png -->
    <img class="hero-image" src="imagem.png" alt="" onerror="this.style.display='none'">

    <button class="menu-button" id="menuButton" type="button"
      aria-expanded="false" aria-controls="menu">
      MENU <span class="arrow" aria-hidden="true">↗</span>
    </button>

    <nav class="menu" id="menu" aria-label="Menu principal">
      <a href="#inicio">Início</a>
      <a href="#sobre">Sobre</a>
      <a href="mailto:contato@sceneone.com.br">Contato</a>
    </nav>

    <section id="inicio">
      <h1 class="headline">Transformando ideias em narrativas visuais</h1>
    </section>
  </main>

  <script>
    const menuButton = document.getElementById('menuButton');
    const menu = document.getElementById('menu');

    menuButton.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
